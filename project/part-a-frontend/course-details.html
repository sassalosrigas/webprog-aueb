<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Λεπτομέρειες Μαθήματος</title>
    
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>

    <script src="assets/js/data/courses.js"></script>
    <script src="app.js"></script> 
</body>
</html>
<main class="details-container">
    
    <header class="details-header">
        <span id="course-category" class="badge"></span>
        <h1 id="course-title">Load Title...</h1>
        <p id="course-desc" class="lead-text"></p>
    </header>

    <div class="details-layout">
        <div class="details-content">
            <img id="course-image" src="" alt="" class="main-image">
            
            <section>
                <h2>Description</h2>
                <p id="course-long-desc"></p>
            </section>

            <section>
                <h2>What You Will Learn (Syllabus)</h2>
                <ul id="course-syllabus" class="syllabus-list">
                    </ul>
            </section>
        </div>

        <aside class="details-sidebar">
            <div class="sidebar-card">
                <div class="price-tag" id="course-price"></div>
                <ul>
                    <li><strong>Duration:</strong> <span id="course-duration"></span></li>
                    <li><strong>Level:</strong> <span id="course-level"></span></li>
                    <li><strong>Instructor:</strong> <span id="course-instructor"></span></li>
                </ul>
                <button class="btn-primary full-width">Enroll Now</button>
            </div>
        </aside>
    </div>
</main>
