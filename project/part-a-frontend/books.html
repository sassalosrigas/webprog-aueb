<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - E-Learn</title>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            
            <a href="index.html" class="logo">E-Learn</a>

            <button class="mobile-menu-btn" aria-label="Toggle navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="courses.html">Courses</a></li>
                    <li><a href="books.html" class="active">Books</a></li>
                    <li><a href="about.html">The Team</a></li>
                    <li><a href="register.html" class="btn-register">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="books-section">
            <h1>Learning Resources</h1>
            <div id="books-grid" class="grid-container"></div>
        </section>

        <section class="filters-section">
            <div class="filters-container">
                <div class="filter-group search-group">
                    <input type="text" id="searchInput" placeholder="Search books...">
                </div>

                <div class="filter-group">
                    <select id="categorySelect">
                        <option value="all">All Categories</option>
                        <option value="web-dev">Web Development</option>
                        <option value="programming">Programming</option>
                        <option value="security">Security</option>
                        <option value="databases">Databases</option>
                    </select>
                </div>

                <div class="filter-group">
                    <select id="levelSelect">
                        <option value="all">All Levels</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
                
                <button id="clearFiltersBtn" class="btn-text">Clear Filters</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 E-Learning Service</p>
    </footer>

    <script src="assets/js/data/books.js"></script>
    <script src="app.js"></script>
</body>
</html>
