<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details - E-Learn</title>
    
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            
            <a href="index.html" class="logo">E-Learn</a>

            <button class="mobile-menu-btn" aria-label="Toggle navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="courses.html">Courses</a></li>
                    <li><a href="books.html">Books</a></li>
                    <li><a href="about.html">The Team</a></li>
                    <li><a href="register.html" class="btn-register">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="details-container book-details-container">
        
        <header class="details-header">
            <span id="book-category" class="badge"></span>
            <h1 id="book-title">Load Title...</h1>
            <p id="book-desc" class="lead-text"></p>
        </header>

        <div class="details-layout">
            <div class="details-content">
                <img id="book-image" src="" alt="" class="main-image">
                
                <section>
                    <h2>Description</h2>
                    <p id="book-long-desc"></p>
                </section>

                <section>
                    <h2>What You Will Learn (Table of Contents)</h2>
                    <ul id="book-syllabus" class="syllabus-list">
                    </ul>
                </section>
            </div>

            <aside class="details-sidebar">
                <div class="sidebar-card">
                    <div class="price-tag" id="book-price"></div>
                    <ul>
                        <li><strong>Pages:</strong> <span id="book-pages"></span></li>
                        <li><strong>Level:</strong> <span id="book-level"></span></li>
                        <li><strong>Author:</strong> <span id="book-author"></span></li>
                        <li><strong>ISBN:</strong> <span id="book-isbn"></span></li>
                    </ul>
                    <button class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-lg);">Purchase Now</button>
                </div>
            </aside>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 E-Learning Service</p>
    </footer>

    <script src="assets/js/data/books.js"></script>
    <script src="app.js"></script> 
</body>
</html>
